name: Deploy Pages PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Build from src/ rather than deploying a committed bundle. Without this
      # the repository's source is not what ships, so editing a component
      # changes nothing on the live site until someone rebuilds by hand.
      # `npm install`, not `npm ci`: the lockfile is regenerated by whichever
      # machine last touched it, and one written on Windows carries win32
      # binaries without their linux counterparts — which `npm ci` treats as a
      # fatal mismatch. install resolves the platform's own binaries instead.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npx vite build

      - name: Stage static PWA for Pages
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, pathlib
          repo = os.environ["REPO"]
          base = "/" + repo
          out = pathlib.Path(".vercel/output/static")
          assets = out / "assets"

          # These two rewrites are what make a TanStack Start SSR bundle run as
          # a static page: the first teaches the router its Pages subpath, the
          # second disables an SSR-only store hydration that otherwise blocks
          # the first paint and leaves a black screen.
          #
          # Both match against MINIFIED output, and the second matches a
          # mangled identifier that a different minifier version is free to
          # rename. A silent miss ships a blank app, so each rewrite is
          # asserted: better a red build than a black screen.
          BASEPATH_HIT = False
          SSR_GUARD_HIT = False

          for p in assets.glob("*.js"):
              text = p.read_text(encoding="utf-8")
              patched = text.replace("basepath:``", f"basepath:`{base}`").replace('basepath:""', f'basepath:"{base}"')
              if patched != text:
                  BASEPATH_HIT = True
              before = patched
              patched = patched.replace("e.stores.ids.get().length||await Qn(e)", "0")
              if patched != before:
                  SSR_GUARD_HIT = True
              if patched != text:
                  p.write_text(patched, encoding="utf-8")
                  print("patched", p.name)

          if not BASEPATH_HIT:
              raise SystemExit(
                  "FATAL: router basepath rewrite matched nothing. Every route would "
                  "resolve against / instead of " + base + ", so the app would 404 on "
                  "Pages. The minified shape of `basepath:` changed — re-derive the "
                  "pattern from .vercel/output/static/assets/index-*.js."
              )
          if not SSR_GUARD_HIT:
              raise SystemExit(
                  "FATAL: SSR store-hydration rewrite matched nothing. The bundle would "
                  "await a server handoff that never arrives on static hosting and "
                  "render a black screen. The mangled identifier was renamed by the "
                  "minifier — re-derive the pattern from the built bundle."
              )
          js = next(assets.glob("index-*.js")).name
          css = next(assets.glob("styles-*.css")).name
          html = f"""<!doctype html>
          <html lang=\"en\">
            <head>
              <meta charset=\"utf-8\" />
              <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\" />
              <meta name=\"theme-color\" content=\"#0b0c10\" />
              <meta name=\"apple-mobile-web-app-capable\" content=\"yes\" />
              <meta name=\"apple-mobile-web-app-title\" content=\"SOMA\" />
              <meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black\" />
              <title>SOMA</title>
              <link rel=\"manifest\" href=\"{base}/__grok/manifest.webmanifest\" />
              <link rel=\"apple-touch-icon\" href=\"{base}/icon-192.png\" />
              <link rel=\"icon\" href=\"{base}/favicon.svg\" type=\"image/svg+xml\" />
              <link rel=\"stylesheet\" href=\"{base}/assets/{css}\" />
              <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\" />
              <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin />
              <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Manrope:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap\" />
            </head>
            <body class=\"antialiased\" style=\"margin:0;background:#0b0c10;color:#eceef1\">
              <script>
                window.TSR_BOOT = true;
                window['$_TSR'] = window['$_TSR'] || {{
                  buffer: [],
                  initialized: false,
                  h: function () {{}},
                  router: {{ manifest: {{ routes: {{}} }}, matches: [] }}
                }};
              </script>
              <script type=\"module\" src=\"{base}/assets/{js}\"></script>
              <script>
                // Registered from the generated shell because only this step
                // knows the Pages subpath the worker must be scoped to.
                if ('serviceWorker' in navigator) {{
                  addEventListener('load', function () {{
                    navigator.serviceWorker.register('{base}/sw.js', {{ scope: '{base}/' }});
                  }});
                }}
              </script>
            </body>
          </html>
          """
          (out / "index.html").write_text(html, encoding="utf-8")
          (out / "404.html").write_text(html, encoding="utf-8")
          grok = out / "__grok"
          grok.mkdir(parents=True, exist_ok=True)
          (grok / "manifest.webmanifest").write_text(
              f"""{{
            \"name\": \"SOMA\",
            \"short_name\": \"SOMA\",
            \"id\": \"{base}/\",
            \"start_url\": \"{base}/\",
            \"scope\": \"{base}/\",
            \"display\": \"standalone\",
            \"background_color\": \"#0b0c10\",
            \"theme_color\": \"#0b0c10\",
            \"icons\": [
                            {{ \"src\": \"{base}/icon-192.png\", \"sizes\": \"192x192\", \"type\": \"image/png\" }},
              {{ \"src\": \"{base}/icon-512.png\", \"sizes\": \"512x512\", \"type\": \"image/png\" }}
            ]
          }}\n""",
              encoding="utf-8",
          )
          # ---------------------------------------------------------------
          # Service worker.
          #
          # This is a gym app: concrete walls, no signal. Without a worker the
          # installed app is a white screen the moment the network drops.
          #
          # Generated here rather than shipped as a static file because the
          # asset names are content-hashed — a hand-written precache list goes
          # stale on the next build and silently caches nothing.
          # ---------------------------------------------------------------
          wasm = [p.name for p in assets.glob("*.wasm")]
          routes = [p.name for p in assets.glob("routes-*.js")]
          precache = [f"{base}/", f"{base}/index.html", f"{base}/assets/{js}", f"{base}/assets/{css}"]
          precache += [f"{base}/assets/{n}" for n in routes + wasm]
          precache += [f"{base}/__grok/manifest.webmanifest", f"{base}/favicon.svg", f"{base}/icon-192.png"]

          # cache.addAll() rejects atomically: one 404 and nothing is cached at
          # all, with no error surfaced anywhere. Keep only paths that exist.
          missing = [u for u in precache
                     if u not in (f"{base}/",) and not (out / u[len(base) + 1:]).exists()]
          if missing:
              print("Skipping absent precache entries:", missing)
          precache = [u for u in precache if u not in missing]

          import json as _json, time as _time
          stamp = _time.strftime("%Y%m%d%H%M%S")
          sw = """const CACHE = 'soma-%s';
const PRECACHE = %s;

// Take over immediately. The user's update ritual is force-quit and reopen;
// waiting for every old client to close would make that not work.
self.addEventListener('install', (e) => {
  e.waitUntil(caches.open(CACHE).then((c) => c.addAll(PRECACHE)).then(() => self.skipWaiting()));
});

self.addEventListener('activate', (e) => {
  e.waitUntil(
    caches.keys()
      .then((keys) => Promise.all(keys.filter((k) => k !== CACHE).map((k) => caches.delete(k))))
      .then(() => self.clients.claim())
  );
});

self.addEventListener('fetch', (e) => {
  const req = e.request;
  if (req.method !== 'GET') return;

  const url = new URL(req.url);

  // Food lookups must never be served from cache: a stale product is worse
  // than an honest failure the UI already handles as "offline".
  if (url.hostname.endsWith('openfoodfacts.org')) return;

  // Anything cross-origin (fonts) is left to the browser.
  if (url.origin !== self.location.origin) return;

  // Navigations resolve to the cached shell, which is what makes the app open
  // at all with no network.
  if (req.mode === 'navigate') {
    e.respondWith(
      fetch(req).catch(() => caches.match('%s/index.html').then((r) => r || caches.match('%s/')))
    );
    return;
  }

  // Hashed assets are immutable, so cache-first is safe and a new build simply
  // requests a new name.
  e.respondWith(
    caches.match(req).then((hit) => {
      if (hit) return hit;
      return fetch(req).then((res) => {
        if (res && res.status === 200 && res.type === 'basic') {
          const copy = res.clone();
          caches.open(CACHE).then((c) => c.put(req, copy));
        }
        return res;
      });
    })
  );
});
""" % (stamp, _json.dumps(precache), base, base)
          (out / "sw.js").write_text(sw, encoding="utf-8")
          print("Service worker precaching", len(precache), "entries")

          print("Staged", js, css, "at", base)
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vercel/output/static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
