name: Deploy Pages PWA

on:
  push:
    # main only. The feature branch was listed here so it could be tested from a
    # phone before an IPA, but the github-pages environment refuses to deploy
    # from any other branch, so every branch push produced a run that built fine
    # and then failed at the deploy step. A workflow that is always red is worse
    # than one that does not run: it trains you to ignore the failure that
    # matters.
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Build from src/ rather than deploying a committed bundle. Without this
      # the repository's source is not what ships, so editing a component
      # changes nothing on the live site until someone rebuilds by hand.
      # `npm install`, not `npm ci`: the lockfile is regenerated by whichever
      # machine last touched it, and one written on Windows carries win32
      # binaries without their linux counterparts — which `npm ci` treats as a
      # fatal mismatch. install resolves the platform's own binaries instead.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        # Pages shows the same version string as the tagged builds; "web" makes
        # it obvious which surface is running when the two differ.
        env:
          APP_VERSION: web-${{ github.run_number }}
        run: npx vite build

      - name: Stage static PWA for Pages
        env:
          REPO: ${{ github.event.repository.name }}
        run: python3 scripts/stage_static.py --base "/$REPO"

      # `enablement` turns Pages ON if it is off, rather than failing.
      #
      # Pages was disabled on the repository at some point and every deploy
      # after that died at this step with "Get Pages site failed: Not Found" —
      # the build was fine, there was simply nowhere to put it, and the live
      # site 404d. A deploy that cannot survive a settings toggle is a deploy
      # that goes down without anybody changing a line of code.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vercel/output/static

  # The app in a real browser before it goes live: every workstation page in
  # both themes, the work log, a timer and an Excel report, and two devices
  # syncing through a local relay, programmes and undo included. A red run
  # here keeps the live site on the last good build. See e2e/app.e2e.mjs.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Browser
        run: npx playwright install --with-deps chromium
      - name: Build at the site root
        run: npx vite build && python3 scripts/stage_static.py --base ""
      - name: Serve the build and a sync relay
        run: |
          python3 -m http.server 4173 --directory .vercel/output/static > static.log 2>&1 &
          node --experimental-strip-types e2e/sync-local.ts > relay.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && curl -sf http://localhost:8787/health >/dev/null && break; sleep 1; done
      - name: Browser tests
        env:
          SHOTS: e2e-shots
        run: node --test --test-concurrency=1 e2e/app.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-shots
          retention-days: 14

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
