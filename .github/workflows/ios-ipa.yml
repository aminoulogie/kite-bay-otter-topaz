name: Build iOS IPA

# Xcode only runs on macOS. Unsigned IPA is signed later by Sideloadly / AltStore.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, e.g. 1.1.0"
        required: false
        type: string
  push:
    tags: ["ios-v*"]
    branches: ["grok-version"]

permissions:
  contents: write
  actions: read

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            V="$INPUT_VERSION"
          elif [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/ios-v}" ]; then
            V="${GITHUB_REF#refs/tags/ios-v}"
          else
            V="1.1.${GITHUB_RUN_NUMBER}"
          fi
          case "$V" in
            *[!0-9.]*|""|.*|*.) echo "FATAL: version '$V' is not digits and dots."; exit 1 ;;
          esac
          echo "marketing=$V" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building SOMA $V (build $GITHUB_RUN_NUMBER)"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Apply Grok store and graph patches
        run: python3 scripts/apply-grok-fixes.py

      - name: Build web bundle
        env:
          APP_VERSION: ${{ steps.ver.outputs.marketing }}
        run: npx vite build

      - name: Stage for native
        run: python3 scripts/stage_static.py --base "" --no-sw

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install pods
        working-directory: ios/App
        run: pod install --repo-update

      - name: Archive (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination 'generic/platform=iOS' \
            MARKETING_VERSION="${{ steps.ver.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive

      - name: Package .ipa
        env:
          V: ${{ steps.ver.outputs.marketing }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          if [ ! -d "$APP" ]; then
            echo "FATAL: no App.app in the archive"
            ls -R "$RUNNER_TEMP/App.xcarchive/Products" || true
            exit 1
          fi
          BUILT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          echo "Built version $BUILT"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "SOMA-$V.ipa" Payload
          echo "Built $(du -h "SOMA-$V.ipa" | cut -f1) unsigned ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: SOMA-${{ steps.ver.outputs.marketing }}-ipa
          path: ${{ runner.temp }}/SOMA-${{ steps.ver.outputs.marketing }}.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ver.outputs.marketing }}
        run: |
          set -euo pipefail
          TAG="ios-v${V}"
          NOTES="Unsigned SOMA IPA. Sign with Sideloadly or AltStore using your Apple ID, then install. Bundle id: io.github.aminoulogie.soma"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/SOMA-$V.ipa" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/SOMA-$V.ipa" \
              --title "SOMA $V unsigned IPA" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
          fi
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
          echo "IPA: https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/SOMA-$V.ipa"
